<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #E85D24;
      --primary-dark: #c94e1e;
      --dark: #141210;
      --light: #F5EFE3;
      --white: #FFFFFF;
      --muted: #8a7f72;
      --success: #4CAF50;
      --warning: #ff9800;
      --danger: #f44336;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--dark) 0%, #1e1b17 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: var(--white);
      padding: 40px 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
      font-weight: 300;
    }

    .content {
      padding: 30px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    #todoInput {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    #todoInput:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(232, 93, 36, 0.1);
    }

    .btn-add {
      padding: 12px 24px;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.15s;
      letter-spacing: 0.5px;
    }

    .btn-add:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-add:active {
      transform: translateY(0);
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 2px solid #e0e0e0;
      background: var(--white);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s;
      letter-spacing: 0.5px;
    }

    .filter-btn.active {
      background: var(--primary);
      color: var(--white);
      border-color: var(--primary);
    }

    .filter-btn:hover {
      border-color: var(--primary);
    }

    .todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--light);
      border-radius: 8px;
      margin-bottom: 12px;
      animation: slideIn 0.3s ease;
      transition: all 0.3s;
    }

    .todo-item:hover {
      box-shadow: 0 4px 12px rgba(232, 93, 36, 0.15);
      transform: translateX(4px);
    }

    .todo-item.completed {
      opacity: 0.7;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .checkbox {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: var(--success);
    }

    .todo-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .todo-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--dark);
      word-break: break-word;
    }

    .todo-time {
      font-size: 12px;
      color: var(--muted);
      font-weight: 300;
    }

    .todo-actions {
      display: flex;
      gap: 8px;
    }

    .btn-delete {
      background: var(--danger);
      color: var(--white);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.3s;
    }

    .btn-delete:hover {
      background: #d32f2f;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 2px solid #e0e0e0;
    }

    .stat {
      text-align: center;
    }

    .stat-num {
      font-size: 24px;
      font-weight: 900;
      color: var(--primary);
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty-state svg {
      width: 60px;
      height: 60px;
      opacity: 0.3;
      margin-bottom: 16px;
    }

    .empty-state p {
      font-size: 16px;
      font-weight: 300;
    }

    .clear-all {
      width: 100%;
      padding: 12px;
      background: #f5f5f5;
      border: none;
      border-radius: 8px;
      color: var(--danger);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 12px;
      font-size: 14px;
    }

    .clear-all:hover {
      background: #eeeeee;
    }

    @media (max-width: 480px) {
      .header {
        padding: 30px 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      .content {
        padding: 20px;
      }

      .input-group {
        flex-direction: column;
      }

      .btn-add {
        width: 100%;
      }

      .stats {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>✓ My Tasks</h1>
      <p>Stay organized and productive</p>
    </div>

    <div class="content">
      <!-- Stats Section -->
      <div class="stats">
        <div class="stat">
          <div class="stat-num" id="totalCount">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="completedCount">0</div>
          <div class="stat-label">Completed</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="pendingCount">0</div>
          <div class="stat-label">Pending</div>
        </div>
      </div>

      <!-- Input Section -->
      <div class="input-group">
        <input 
          type="text" 
          id="todoInput" 
          placeholder="Add a new task..." 
          autocomplete="off"
        >
        <button class="btn-add" onclick="addTodo()">Add</button>
      </div>

      <!-- Filter Section -->
      <div class="filters">
        <button class="filter-btn active" onclick="filterTodos('all')">All</button>
        <button class="filter-btn" onclick="filterTodos('pending')">Pending</button>
        <button class="filter-btn" onclick="filterTodos('completed')">Completed</button>
      </div>

      <!-- Todo List -->
      <ul class="todo-list" id="todoList"></ul>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <p>No tasks yet. Add one to get started!</p>
      </div>

      <!-- Clear All Button -->
      <button class="clear-all" onclick="clearCompleted()" id="clearBtn" style="display: none;">
        Clear Completed Tasks
      </button>
    </div>
  </div>

  <script>
    // Local Storage Key
    const STORAGE_KEY = 'todos';
    let currentFilter = 'all';

    // Initialize app
    window.addEventListener('DOMContentLoaded', () => {
      loadTodos();
      updateStats();
      document.getElementById('todoInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addTodo();
      });
    });

    // Add a new todo
    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();

      if (!text) {
        input.focus();
        return;
      }

      const todos = getTodos();
      const newTodo = {
        id: Date.now(),
        text: text,
        completed: false,
        createdAt: new Date().toLocaleString()
      };

      todos.push(newTodo);
      saveTodos(todos);
      input.value = '';
      loadTodos();
      updateStats();
      input.focus();
    }

    // Toggle todo completion
    function toggleTodo(id) {
      const todos = getTodos();
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.completed = !todo.completed;
        saveTodos(todos);
        loadTodos();
        updateStats();
      }
    }

    // Delete a todo
    function deleteTodo(id) {
      const todos = getTodos().filter(t => t.id !== id);
      saveTodos(todos);
      loadTodos();
      updateStats();
    }

    // Clear completed todos
    function clearCompleted() {
      if (confirm('Delete all completed tasks?')) {
        const todos = getTodos().filter(t => !t.completed);
        saveTodos(todos);
        loadTodos();
        updateStats();
      }
    }

    // Filter todos
    function filterTodos(filter) {
      currentFilter = filter;
      
      // Update active button
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');

      loadTodos();
    }

    // Load and display todos
    function loadTodos() {
      const todos = getTodos();
      const todoList = document.getElementById('todoList');
      const emptyState = document.getElementById('emptyState');

      let filtered = todos;
      if (currentFilter === 'completed') {
        filtered = todos.filter(t => t.completed);
      } else if (currentFilter === 'pending') {
        filtered = todos.filter(t => !t.completed);
      }

      todoList.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
      }

      filtered.forEach(todo => {
        const li = document.createElement('li');
        li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <input 
            type="checkbox" 
            class="checkbox"
            ${todo.completed ? 'checked' : ''}
            onchange="toggleTodo(${todo.id})"
          >
          <div class="todo-content">
            <div class="todo-text">${escapeHtml(todo.text)}</div>
            <div class="todo-time">${todo.createdAt}</div>
          </div>
          <div class="todo-actions">
            <button class="btn-delete" onclick="deleteTodo(${todo.id})">Delete</button>
          </div>
        `;
        todoList.appendChild(li);
      });

      // Show/hide clear button
      const completedCount = todos.filter(t => t.completed).length;
      document.getElementById('clearBtn').style.display = completedCount > 0 ? 'block' : 'none';
    }

    // Update stats
    function updateStats() {
      const todos = getTodos();
      const completed = todos.filter(t => t.completed).length;
      const pending = todos.length - completed;

      document.getElementById('totalCount').textContent = todos.length;
      document.getElementById('completedCount').textContent = completed;
      document.getElementById('pendingCount').textContent = pending;
    }

    // Get todos from local storage
    function getTodos() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    // Save todos to local storage
    function saveTodos(todos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
